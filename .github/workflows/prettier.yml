name: Prettier

on:
  pull_request:
    branches:
      - develop

  workflow_dispatch:

concurrency:
  group: prettier--${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-code-formatting:
    name: Check Code Formatting
    runs-on: ubuntu-latest

    env:
      NODE_VERSION: 22.x # ----- the version of node.js to use

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup .npmrc
        run: |
          echo "@awesome.me:registry=https://npm.fontawesome.com/"                           >> .npmrc
          echo "@fortawesome:registry=https://npm.fontawesome.com/"                          >> .npmrc
          echo "//npm.fontawesome.com/:_authToken=${{ secrets.FONT_AWESOME_PKG_MGR_TOKEN }}" >> .npmrc

      - name: Install Dependencies
        run: npm ci

      - name: Run Prettier Check
        run: npm run format:linux:check-only
