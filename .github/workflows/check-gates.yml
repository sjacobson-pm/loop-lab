name: check-gates

# Runs the deterministic loop harness tests without dispatching an agent.

on:
  pull_request:
    paths:
      - '.loop/**'
      - '.github/workflows/check-gates.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
  push:
    branches:
      - main
    paths:
      - '.loop/**'
      - '.github/workflows/check-gates.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Setup .npmrc
        run: |
          echo "@awesome.me:registry=https://npm.fontawesome.com/"                           >> .npmrc
          echo "@fortawesome:registry=https://npm.fontawesome.com/"                          >> .npmrc
          echo "//npm.fontawesome.com/:_authToken=${{ secrets.FONT_AWESOME_PKG_MGR_TOKEN }}" >> .npmrc

      - name: Install dependencies
        run: npm ci && npm --prefix .loop ci --registry=https://registry.npmjs.org/

      - name: Run deterministic loop regression suite
        run: npm --prefix .loop run test:coverage
