name: Build the React Application

on:
  pull_request:
    branches:
      - develop

  workflow_call:
    inputs:
      environment:
        description: 'Deployment environment'
        required: false
        type: string
      versionTag:
        description: 'Optional version tag to check out (e.g. v1.2.3)'
        required: false
        type: string

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  WEB_APP_ARTIFACT_NAME: react-app-artifact # ----- the name of the web app artifact to be used in the deployment

jobs:
  build-react-app:
    name: Build the React App
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'development' }}

    env:
      ARTIFACT_FILE_NAME: react-app.zip # ----- the file name of the archived/zipped build artifact
      NODE_VERSION: 22.x # -------------------- the version of node.js to use for the build
      WEB_APP_BUILD_OUTPUT_PATH: ./dist # ----- the path to the build output

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.versionTag || github.sha }}

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup .npmrc
        run: |
          echo "@awesome.me:registry=https://npm.fontawesome.com/"                           >> .npmrc
          echo "@fortawesome:registry=https://npm.fontawesome.com/"                          >> .npmrc
          echo "//npm.fontawesome.com/:_authToken=${{ secrets.FONT_AWESOME_PKG_MGR_TOKEN }}" >> .npmrc

      - name: Cache Node Modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install Dependencies
        run: npm ci

      - name: Build (${{ vars.BUILD_TYPE }})
        run: npm run build:${{ vars.BUILD_TYPE }}

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.WEB_APP_ARTIFACT_NAME }}
          path: ${{ env.WEB_APP_BUILD_OUTPUT_PATH }}
          if-no-files-found: error
