name: loop-leg-stub

on:
  workflow_dispatch:
    inputs:
      task_id: { required: true, type: string }
      attempt: { required: true, type: string }
      outcomes: { required: false, type: string, default: "pass" }

permissions:
  contents: read

jobs:
  stub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stand in for the agent
        run: |
          mkdir -p "runs/${{ inputs.task_id }}"
          printf 'attempt %s work product\n' "${{ inputs.attempt }}" \
            > "runs/${{ inputs.task_id }}/work-product.txt"

      - name: Gate
        run: |
          node .github/tools/check-stub.mjs \
            --task-id  "${{ inputs.task_id }}" \
            --attempt  "${{ inputs.attempt }}" \
            --outcomes "${{ inputs.outcomes }}" \
            --work     "runs/${{ inputs.task_id }}/work-product.txt" \
            --out      verdict.json

      - uses: actions/upload-artifact@v4
        with:
          name: verdict
          path: verdict.json
